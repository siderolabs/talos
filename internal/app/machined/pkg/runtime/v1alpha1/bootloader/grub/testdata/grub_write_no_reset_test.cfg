set default="A - TestOld v0.0.1"

set timeout=3

insmod all_video

terminal_input console
terminal_output console

probe --set=talos_bootpart --part-uuid $root

menuentry "A - TestOld v0.0.1" {
  set gfxmode=auto
  set gfxpayload=text
  linux /A/vmlinuz cmdline A talos.boot.partuuid=$talos_bootpart
  initrd /A/initramfs.xz
}
