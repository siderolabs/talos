---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
volumeType: memory
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
volumeType: memory
provisioning:
  minSize: 3GiB
---
# Single-node ephemeral cluster: schedule workloads on the control plane.
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
    node-role.kubernetes.io/control-plane:
        $patch: delete
