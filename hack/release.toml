# commit to be tagged for new release
commit = "HEAD"

project_name = "Talos"
github_repo = "siderolabs/talos"
match_deps = "^github.com/((talos-systems|siderolabs)/[a-zA-Z0-9-]+)$"
ignore_deps = ["github.com/coredns/coredns"]

# previous release
previous = "v1.13.0"

pre_release = true

preface = """
"""

[notes]
    [notes.updates]
        title = "Component Updates"
        description = """\
Linux: 6.18.45
Kubernetes: 1.37.0-rc.1
containerd: 2.3.4
CoreDNS: 1.14.7

Talos is built with Go 1.26.7.
"""

    [notes.ipvs]
        title = "IPVS Support"
        description = """\
Following Kubernetes deprecation of IPVS support (`kube-proxy`), Talos Linux now ships IPVS as kernel modules which are not loaded by default.

If you require IPVS support, you can enable it by loading the following kernel modules:

* `ip_vs` (core)
* `ip_vs_rr`, `ip_vs_wrr`, `ip_vs_lc`, `ip_vs_sh` or `ip_vs_mh` (scheduling algorithms)
* `xt_ipvs` (nftables/iptables match)
"""

    [notes.lockdown]
        title = "Secure Boot images no longer have lockdown=confidentiality enabled by default"
        description = """\
Secure Boot images no longer have `lockdown=confidentiality` enabled by default.
This change was made to improve compatibility with eBPF tooling under default schematic.
This means that Secure Boot images will now have `lockdown=integrity` enabled by default (implicitly), which is the recommended setting for most users.
Users can override it by adding `lockdown=confidentiality` to the kernel command line through Image Factory if they require it.
"""

    [notes.volume_wipe]
        title = "System Volume Wipe"
        description = """\
Talos now supports wiping system volumes by their volume ID with the new `talosctl wipe volume <ID>` command
(e.g. `talosctl wipe volume EPHEMERAL`).

By default the volume is wiped immediately; a volume which is currently in use cannot be wiped live, so use
`--on-reboot` to stage the wipe. A staged wipe is recorded and applied early on the next boot, before the
volume manager provisions volumes, and the volume is re-provisioned cleanly afterwards.

The `META` volume is not a valid wipe target and is rejected: it carries the staged wipe instructions
themselves, so it is the one volume which has to be provisioned *before* the wipe runs, and it also holds
the machine's unique token.

This can be combined with `talosctl apply-config --staged` to reshape system volumes across a reboot, for
example splitting the monolithic EPHEMERAL volume into sub-volumes.
"""

[make_deps]

    [make_deps.tools]
        variable = "TOOLS"
        repository = "github.com/siderolabs/tools"

    [make_deps.pkgs]
        variable = "PKGS"
        repository = "github.com/siderolabs/pkgs"
