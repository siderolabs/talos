syntax = "proto3";

package talos.resource.definitions.hardware;

option go_package = "github.com/siderolabs/talos/pkg/machinery/api/resource/definitions/hardware";
option java_package = "dev.talos.api.resource.definitions.hardware";

import "common/common.proto";

// BMCDeviceSpec describes a BMC as reported over the local IPMI interface.
//
// The identity fields come from Get Device ID, the network configuration from
// Get LAN Configuration Parameters. Network configuration is best-effort: a BMC
// with no LAN channel configured (or one which doesn't implement the commands)
// yields the identity fields only.
message BMCDeviceSpec {
  // ManufacturerID is the IANA enterprise number of the BMC vendor (e.g. 674 for Dell).
  uint32 manufacturer_id = 1;
  // Manufacturer is the vendor name resolved from ManufacturerID, empty if the vendor is not known.
  string manufacturer = 2;
  // ProductID is the vendor-specific product identifier of the BMC.
  uint32 product_id = 3;
  // FirmwareVersion is the BMC firmware revision, e.g. `7.10`.
  string firmware_version = 4;
  // IPMIVersion is the IPMI specification version supported by the BMC, e.g. `2.0`.
  string ipmi_version = 5;
  // Channel is the IPMI LAN channel the network configuration was read from.
  uint32 channel = 6;
  // Address is the BMC IP address with its subnet mask.
  common.NetIPPrefix address = 7;
  // Gateway is the BMC default gateway.
  common.NetIP gateway = 8;
  // HardwareAddr is the MAC address of the BMC LAN interface.
  bytes hardware_addr = 9;
}

// CPUCoreSpec represents a single CPU core as seen by the Linux kernel.
message CPUCoreSpec {
  // Socket is the physical package (socket) identifier the core belongs to.
  string socket = 1;
  // CoreID is the core identifier within the socket.
  string core_id = 2;
  // LogicalCPUs is the sorted list of logical CPU (hardware thread) numbers belonging to this core.
  repeated uint32 logical_cp_us = 3;
  // VendorID is the CPU vendor identifier (e.g. `GenuineIntel`, `AuthenticAMD`).
  string vendor_id = 4;
  // CPUFamily is the CPU family.
  string cpu_family = 5;
  // Model is the CPU model number.
  string model = 6;
  // ModelName is the human-readable CPU model name.
  string model_name = 7;
  // Stepping is the CPU stepping.
  string stepping = 8;
  // Microcode is the microcode revision.
  string microcode = 9;
  // CacheSize is the CPU cache size as reported by the kernel (e.g. `512 KB`).
  string cache_size = 10;
  // CoresPerSocket is the number of cores in the socket this core belongs to.
  uint32 cores_per_socket = 11;
  // ThreadsPerSocket is the number of logical CPUs (siblings) in the socket this core belongs to.
  uint32 threads_per_socket = 12;
  // Flags is the list of CPU feature flags.
  repeated string flags = 13;
  // Bugs is the list of known CPU bugs.
  repeated string bugs = 14;
  // BogoMips is the kernel BogoMips measurement for the core.
  double bogo_mips = 15;
  // AddressSizes describes the physical and virtual address sizes.
  string address_sizes = 16;
}

// CPUScalingSpecSpec describes the cpufreq settings requested for a policy.
//
// An empty field leaves that attribute alone.
message CPUScalingSpecSpec {
  // Governor is the scaling governor to set.
  string governor = 1;
  // EnergyPerformancePreference is the energy performance preference to set.
  string energy_performance_preference = 2;
  // MinFrequencyKhz is the lower bound of the frequency window to set, in kHz.
  uint64 min_frequency_khz = 3;
  // MaxFrequencyKhz is the upper bound of the frequency window to set, in kHz.
  uint64 max_frequency_khz = 4;
  // ConfigName is the CPUScalingConfig document these settings came from.
  string config_name = 5;
}

// CPUScalingStatusSpec describes a cpufreq policy: which CPUs it drives, what its driver supports,
// and the governor, energy performance preference and frequency limits currently in effect.
//
// Only values which are stable unless something sets them are reported. The current and requested
// frequencies are left out: the kernel moves them continuously, and reporting them would rewrite
// this resource on every read.
message CPUScalingStatusSpec {
  // Driver is the cpufreq scaling driver backing the policy (e.g. `intel_pstate`, `intel_cpufreq`, `acpi-cpufreq`).
  string driver = 1;
  // AffectedCPUs is the sorted list of online logical CPUs whose frequency this policy controls.
  repeated uint32 affected_cp_us = 2;
  // RelatedCPUs is the sorted list of all logical CPUs belonging to this policy, online or not.
  repeated uint32 related_cp_us = 3;
  // AvailableGovernors is the list of scaling governors the driver offers for this policy.
  repeated string available_governors = 4;
  // AvailableEPPs is the list of energy performance preferences the driver offers, empty unless
  // the driver implements them (HWP-enabled intel_pstate, amd-pstate in active mode).
  repeated string available_ep_ps = 5;
  // Governor is the scaling governor currently in effect.
  string governor = 6;
  // EnergyPerformancePreference is the energy performance preference currently in effect.
  string energy_performance_preference = 7;
  // CPUInfoMinFrequencyKhz is the lowest frequency the hardware supports, in kHz.
  uint64 cpu_info_min_frequency_khz = 8;
  // CPUInfoMaxFrequencyKhz is the highest frequency the hardware supports, in kHz.
  uint64 cpu_info_max_frequency_khz = 9;
  // BaseFrequencyKhz is the sustained (non-turbo) frequency, in kHz, reported only by some drivers.
  uint64 base_frequency_khz = 10;
  // CPUCapacity is the scheduler's capacity rating of the policy's first CPU, relative to 1024
  // for the most capable CPU in the system. On asymmetric systems it distinguishes big from little cores.
  uint32 cpu_capacity = 11;
  // CoreType is `performance` or `efficiency` on CPUs with a hybrid topology, empty otherwise.
  string core_type = 12;
  // ScalingMinFrequencyKhz is the lowest frequency the policy currently allows the governor to pick, in kHz.
  uint64 scaling_min_frequency_khz = 13;
  // ScalingMaxFrequencyKhz is the highest frequency the policy currently allows the governor to pick, in kHz.
  uint64 scaling_max_frequency_khz = 14;
}

// MemoryModuleSpec represents a single Memory.
message MemoryModuleSpec {
  uint32 size = 1;
  string device_locator = 2;
  string bank_locator = 3;
  uint32 speed = 4;
  string manufacturer = 5;
  string serial_number = 6;
  string asset_tag = 7;
  string product_name = 8;
}

// PCIDeviceSpec represents a single processor.
message PCIDeviceSpec {
  string class = 1;
  string subclass = 2;
  string vendor = 3;
  string product = 4;
  string class_id = 5;
  string subclass_id = 6;
  string vendor_id = 7;
  string product_id = 8;
  string driver = 9;
}

// PCIDriverRebindConfigSpec describes PCI rebind configuration.
message PCIDriverRebindConfigSpec {
  string pciid = 1;
  string target_driver = 2;
}

// PCIDriverRebindStatusSpec describes status of rebinded drivers.
message PCIDriverRebindStatusSpec {
  string pciid = 1;
  string target_driver = 2;
}

// ProcessorSpec represents a single processor.
message ProcessorSpec {
  string socket = 1;
  string manufacturer = 2;
  string product_name = 3;
  // MaxSpeed is in megahertz (MHz).
  uint32 max_speed = 4;
  // BootSpeed is in megahertz (MHz).
  uint32 boot_speed = 5;
  uint32 status = 6;
  string serial_number = 7;
  string asset_tag = 8;
  string part_number = 9;
  uint32 core_count = 10;
  uint32 core_enabled = 11;
  uint32 thread_count = 12;
}

// SystemInformationSpec represents the system information obtained from smbios.
message SystemInformationSpec {
  string manufacturer = 1;
  string product_name = 2;
  string version = 3;
  string serial_number = 4;
  string uuid = 5;
  string wake_up_type = 6;
  string sku_number = 7;
  string bios_version = 8;
}

