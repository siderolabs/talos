syntax = "proto3";

package talos.resource.definitions.time;

option go_package = "github.com/siderolabs/talos/pkg/machinery/api/resource/definitions/time";
option java_package = "dev.talos.api.resource.definitions.time";

import "google/protobuf/duration.proto";

// AdjtimeStatusSpec describes Linux internal adjtime state.
message AdjtimeStatusSpec {
  google.protobuf.Duration offset = 1;
  double frequency_adjustment_ratio = 2;
  google.protobuf.Duration max_error = 3;
  google.protobuf.Duration est_error = 4;
  string status = 5;
  int64 constant = 6;
  bool sync_status = 7;
  string state = 8;
}

// StatusSpec describes time sync state.
message StatusSpec {
  // Synced indicates whether time is in sync.
  bool synced = 1;
  // Epoch is incremented every time clock jumps more than 15min.
  int64 epoch = 2;
  // SyncDisabled indicates if time sync is disabled.
  bool sync_disabled = 3;
  // SpikeDetected indicates that the last time measurement was discarded by the spike filter.
  //
  // A discarded measurement is not applied to the clock at all, so a filter which keeps
  // rejecting looks exactly like a clock which is never corrected.
  bool spike_detected = 4;
  // ConsecutiveSpikes is the number of time measurements discarded in a row by the spike filter.
  int64 consecutive_spikes = 5;
}

