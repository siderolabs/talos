syntax = "proto3";

package talos.resource.definitions.containers;

option go_package = "github.com/siderolabs/talos/pkg/machinery/api/resource/definitions/containers";
option java_package = "dev.talos.api.resource.definitions.containers";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "resource/definitions/enums/enums.proto";

// ContainerDependencyStatusSpec is the spec for ContainerDependencyStatus.
message ContainerDependencyStatusSpec {
  // WaitingFor lists the unmet readiness gates (image, mounts, dependsOn entries).
  repeated string waiting_for = 1;
}

// ContainerDependsOnSpec is the resolved dependency set.
message ContainerDependsOnSpec {
  repeated string paths = 1;
  repeated string networks = 2;
  bool time = 3;
  repeated string containers = 4;
}

// ContainerDeviceSpec is a device handed to the container.
message ContainerDeviceSpec {
  // Kind is "rawVolume".
  string kind = 1;
  // VolumeName is the name of the RawVolumeConfig a rawVolume device refers to, e.g. "data".
  string volume_name = 2;
  // Destination of the device node inside the container.
  string destination = 3;
}

// ContainerHealthStatusSpec is the spec for ContainerHealthStatus.
message ContainerHealthStatusSpec {
  // Healthy is true once a check has passed, and false once failureThreshold consecutive checks failed.
  bool healthy = 1;
  // Message is the error of the last failed check, while unhealthy.
  string message = 2;
  // LastChange is when Healthy last changed.
  google.protobuf.Timestamp last_change = 3;
}

// ContainerImageSpec is a resolved container image reference.
message ContainerImageSpec {
  string ref = 1;
}

// ContainerImageStatusSpec is the spec for ContainerImageStatus.
message ContainerImageStatusSpec {
  talos.resource.definitions.enums.ContainersContainerImagePhase phase = 1;
  // Image is the reference that was requested, in canonical form.
  string image = 2;
  // Digest is the resolved digest, set once the pull completes.
  string digest = 3;
  // Error is the last pull failure, verbatim.
  string error = 4;
}

// ContainerInstanceSpecSpec is the spec for ContainerInstanceSpec.
//
// It carries a resolved snapshot of everything needed to run one execution, so whatever runs it
// never has to re-read the container spec or image status. That keeps the execution independent of
// later changes to those inputs: a spec change destroys this instance rather than mutating it.
message ContainerInstanceSpecSpec {
  // ContainerID is the name of the owning container, i.e. the ContainerSpec ID.
  string container_id = 1;
  // Generation is this instance's sequence number for that container.
  uint64 generation = 2;
  // Image is the digest-resolved reference to run.
  string image = 3;
  repeated string entrypoint = 4;
  repeated string args = 5;
  string working_dir = 6;
  ContainerRunAsSpec run_as = 7;
  repeated string environment = 8;
  // Mounts are fully resolved, with host source paths filled in.
  repeated ResolvedMountSpec mounts = 9;
  ContainerSecuritySpec security = 10;
  ContainerNetworkSpec network = 11;
  ContainerResourcesSpec resources = 12;
  // Devices are fully resolved, with host device nodes filled in.
  repeated ResolvedDeviceSpec devices = 13;
  google.protobuf.Duration stop_timeout = 14;
  // ExecutionHash is the ContainerSpec execution hash the instance was created for.
  string execution_hash = 15;
}

// ContainerInstanceStatusSpec is the spec for ContainerInstanceStatus.
message ContainerInstanceStatusSpec {
  // ContainerID is the name of the owning container, i.e. the ContainerSpec ID.
  string container_id = 1;
  // Generation is the reported instance's sequence number for that container.
  uint64 generation = 2;
  // Phase is the current execution phase.
  talos.resource.definitions.enums.ContainersContainerInstancePhase phase = 3;
  // PID is the task's process ID while running.
  uint32 pid = 4;
  // ExitCode is the task's exit code, meaningful only once Phase is ContainerInstancePhaseTerminated.
  int32 exit_code = 5;
  // Error describes why the task never started or exited abnormally.
  string error = 6;
  // StartedAt is when the task's process started.
  google.protobuf.Timestamp started_at = 7;
  // FinishedAt is when the task stopped running.
  google.protobuf.Timestamp finished_at = 8;
  // Refused is set when Talos didn't start the instance because the mounts or devices it was
  // created with are out of date. It says nothing about the container itself.
  bool refused = 9;
}

// ContainerLifecycleSpec is the spec for ContainerLifecycle.
message ContainerLifecycleSpec {
  // ShutdownDeadline is set when the resource is torn down: all containers have to be stopped by then.
  google.protobuf.Timestamp shutdown_deadline = 1;
}

// ContainerMountSpec is a resolved mount.
//
// Exactly one of VolumeName, Tmpfs or HostPath describes the source; Kind says which.
message ContainerMountSpec {
  // Kind is one of "volume", "tmpfs" or "hostPath".
  string kind = 1;
  // Source is the host path for a hostPath mount.
  string source = 3;
  // Destination inside the container.
  string destination = 4;
  // Size of a tmpfs mount, in bytes; zero means the kernel default.
  uint64 size = 5;
  // Options with the writable default already applied.
  repeated string options = 6;
  // VolumeName is the name of the user, existing or external volume a volume mount refers to,
  // e.g. "web-content".
  string volume_name = 7;
}

// ContainerMountStatusSpec is the spec for ContainerMountStatus.
message ContainerMountStatusSpec {
  // Ready is true once every mount the container declares is available.
  bool ready = 1;
  // Mounts are the resolved mounts, with host source paths filled in. Only meaningful when Ready.
  repeated ResolvedMountSpec mounts = 2;
  // Error describes why the mounts are not ready.
  string error = 3;
  // Devices are the resolved devices, with host device nodes filled in. Only meaningful when Ready.
  repeated ResolvedDeviceSpec devices = 4;
}

// ContainerNetworkSpec is the resolved network configuration.
message ContainerNetworkSpec {
  // HostNetwork shares the host network namespace instead of creating an empty one.
  bool host_network = 1;
}

// ContainerResourcesSpec is the resolved cgroup configuration, in bytes and millicores.
//
// Zero means unset, which for a limit means unlimited. The swap limit is a pointer because zero is
// meaningful there: it keeps the container out of swap, while nil leaves swap unlimited.
message ContainerResourcesSpec {
  uint64 memory_limit = 1;
  uint64 cpu_limit = 2;
  uint64 swap_limit = 3;
}

// ContainerRestartSpec describes how a container is restarted after it exits.
message ContainerRestartSpec {
  talos.resource.definitions.enums.ContainersContainerRestartPolicy policy = 1;
  // MaxRetries is how many times a failed container is restarted at most; nil is unlimited.
  optional uint32 max_retries = 2;
  google.protobuf.Duration delay = 3;
  google.protobuf.Duration max_delay = 4;
}

// ContainerRunAsSpec is the resolved uid/gid override.
//
// Nil means use the image's own USER for that half.
message ContainerRunAsSpec {
  int32 uid = 1;
  int32 gid = 2;
}

// ContainerRunStatusSpec is the spec for ContainerRunStatus.
message ContainerRunStatusSpec {
  // ExecutionHash is the ContainerSpec execution hash the counters are for.
  string execution_hash = 1;
  // NextGeneration is the generation of the next instance.
  uint64 next_generation = 2;
  // Restarts is the number of restarts since the execution hash or the restart policy last changed.
  uint32 restarts = 3;
  // BackoffStep is how many times the restart delay has doubled.
  uint32 backoff_step = 4;
  // RestartedGeneration is the generation whose restart has been charged, if Restarted.
  uint64 restarted_generation = 5;
  bool restarted = 6;
  // Policy is the restart policy the restarts were counted under.
  talos.resource.definitions.enums.ContainersContainerRestartPolicy policy = 7;
  // FinishedGeneration is the generation of the finished instance FinishedState is the outcome of.
  uint64 finished_generation = 8;
  // FinishedState is what InstanceController decided for that instance: exited while it is
  // restarted, completed or failed when it is not. It is published so that what reports the state
  // of the container doesn't decide it again.
  talos.resource.definitions.enums.ContainersContainerState finished_state = 9;
}

// ContainerSecuritySpec is the resolved security posture.
message ContainerSecuritySpec {
  // Privileged grants all grantable capabilities and all devices, and mounts sysfs read-write.
  bool privileged = 1;
  repeated string capabilities_add = 2;
  repeated string capabilities_drop = 3;
  // MachinedAccess publishes the container's PID as a ServicePID resource and mounts the
  // machined API socket into the container.
  bool machined_access = 4;
  // SeccompUnconfined applies no seccomp filter instead of the default profile.
  bool seccomp_unconfined = 5;
  // SELinuxLevel is the MCS level the container runs at, stable across restarts so that it keeps
  // access to the files it writes; empty when containers run without categories.
  string se_linux_level = 6;
  // SeccompLocalhostProfile is the name of the seccomp profile applied instead of the default
  // one; empty when the default profile applies, or none at all.
  string seccomp_localhost_profile = 7;
  // SeccompLocalhostProfileContent is the seccomp profile named by SeccompLocalhostProfile, as
  // JSON in the OCI runtime-spec LinuxSeccomp format. Carrying the content rather than only the
  // name makes an edit of the profile change the spec, which restarts the container.
  string seccomp_localhost_profile_content = 8;
}

// ContainerSpecSpec is the spec for ContainerSpec.
message ContainerSpecSpec {
  // Image is the OCI reference in canonical form, already normalized by ContainerConfigController.
  ContainerImageSpec image = 1;
  repeated string entrypoint = 2;
  repeated string args = 3;
  string working_dir = 4;
  ContainerRunAsSpec run_as = 5;
  repeated string environment = 6;
  repeated ContainerMountSpec mounts = 7;
  ContainerSecuritySpec security = 8;
  ContainerNetworkSpec network = 9;
  ContainerResourcesSpec resources = 10;
  ContainerDependsOnSpec depends_on = 11;
  repeated ContainerDeviceSpec devices = 12;
  google.protobuf.Duration stop_timeout = 13;
  ContainerRestartSpec restart = 14;
}

// ContainerStatusSpec is the spec for ContainerStatus.
message ContainerStatusSpec {
  // State is the fine-grained lifecycle position, derived from the newest instance.
  talos.resource.definitions.enums.ContainersContainerState state = 1;
  // Health is the coarse user-facing status.
  talos.resource.definitions.enums.ContainersContainerHealth health = 2;
  // Image is the resolved digest once the pull completes, otherwise the requested reference.
  string image = 3;
  // PID of the running task; zero when not running.
  uint32 pid = 4;
  // ExitCode of the last task exit.
  int32 exit_code = 5;
  // RestartCount is the number of restarts since the configuration of the container last changed.
  uint64 restart_count = 6;
  // Error is the last failure, verbatim, from whichever stage produced it.
  string error = 7;
  // WaitingFor lists the unmet readiness gates (image, mounts, dependsOn entries) while State is pending.
  repeated string waiting_for = 8;
  // Generation is the generation of the newest instance.
  uint64 generation = 9;
}

// ResolvedDeviceSpec is a device with its host-side device node resolved.
message ResolvedDeviceSpec {
  string kind = 1;
  // Source is the device node on the host, e.g. "/dev/sdb1", or "/dev/dm-0" for an encrypted volume.
  string source = 2;
  string destination = 3;
  // VolumeID is the block volume ID of a rawVolume device, e.g. "r-data".
  string volume_id = 4;
  // VolumeName is the name of the RawVolumeConfig a rawVolume device refers to.
  string volume_name = 5;
}

// ResolvedMountSpec is a mount with its host-side source resolved.
message ResolvedMountSpec {
  string kind = 1;
  // Source is the host path to bind from; empty for tmpfs.
  string source = 2;
  string destination = 3;
  uint64 size = 4;
  repeated string options = 5;
  // VolumeID is the block volume ID of a volume mount, e.g. "u-web-content"; empty for tmpfs and hostPath.
  string volume_id = 6;
  // VolumeName is the name of the user, existing or external volume a volume mount refers to;
  // empty for tmpfs and hostPath.
  string volume_name = 7;
}

