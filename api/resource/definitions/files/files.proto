syntax = "proto3";

package talos.resource.definitions.files;

option go_package = "github.com/siderolabs/talos/pkg/machinery/api/resource/definitions/files";
option java_package = "dev.talos.api.resource.definitions.files";

// EtcFileSpecSpec describes status of rendered secrets.
message EtcFileSpecSpec {
  bytes contents = 1;
  uint32 mode = 2;
  string selinux_label = 3;
}

// EtcFileStatusSpec describes status of rendered secrets.
message EtcFileStatusSpec {
  string spec_version = 1;
}

// InlineDataVolumeStatusSpec describes the rendered files of an inline data volume.
message InlineDataVolumeStatusSpec {
  // VolumeID is the ID of the volume holding the files.
  string volume_id = 1;
  // ContentsHash is the hash of the rendered files.
  string contents_hash = 2;
  // Files is the number of rendered files.
  int64 files = 3;
  // Device is the device number of the filesystem holding the files.
  uint64 device = 4;
}

