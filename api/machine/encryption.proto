syntax = "proto3";

package machine;

option go_package = "github.com/siderolabs/talos/pkg/machinery/api/machine";
option java_package = "dev.talos.api.machine";

import "common/common.proto";

// EncryptionService manages disk encryption keys of the volumes on a Talos node.
service EncryptionService {
  // RecoveryKeySupply supplies the disk encryption recovery key to unlock locked volumes.
  rpc RecoveryKeySupply(RecoveryKeySupplyRequest) returns (RecoveryKeySupplyResponse);
  // RecoveryKeyVerify verifies the disk encryption recovery key against the recovery key slot of the volumes.
  //
  // A valid key acknowledges a pending generated key: the operator holds it, so the node marks it as fetched and drops it.
  rpc RecoveryKeyVerify(RecoveryKeyVerifyRequest) returns (RecoveryKeyVerifyResponse);
  // RecoveryKeyFetch fetches the disk encryption recovery keys generated by the node.
  //
  // Nothing changes on the node: the key stays pending until it's acknowledged with RecoveryKeyVerify,
  // and is regenerated on every boot until then.
  rpc RecoveryKeyFetch(RecoveryKeyFetchRequest) returns (RecoveryKeyFetchResponse);
}

message RecoveryKeySupplyRequest {
  // Volume IDs to supply the key for, defaults to all volumes with a recovery key configured.
  repeated string volumes = 1;
  // Recovery key.
  bytes key = 2;
}

message RecoveryKeySupply {
  common.Metadata metadata = 1;
  // Volume IDs the key was supplied for.
  repeated string volumes = 2;
}

message RecoveryKeySupplyResponse {
  repeated RecoveryKeySupply messages = 1;
}

message RecoveryKeyVerifyRequest {
  // Volume IDs to verify the key against, defaults to all volumes with a recovery key configured.
  repeated string volumes = 1;
  // Recovery key.
  bytes key = 2;
}

message RecoveryKeyVerifyResult {
  string volume = 1;
  bool valid = 2;
}

message RecoveryKeyVerify {
  common.Metadata metadata = 1;
  repeated RecoveryKeyVerifyResult results = 2;
}

message RecoveryKeyVerifyResponse {
  repeated RecoveryKeyVerify messages = 1;
}

message RecoveryKeyFetchRequest {
  // Volume IDs to fetch the key for, defaults to all volumes with a generated key pending.
  repeated string volumes = 1;
}

message RecoveryKeyFetchResult {
  string volume = 1;
  bytes key = 2;
}

message RecoveryKeyFetch {
  common.Metadata metadata = 1;
  repeated RecoveryKeyFetchResult results = 2;
}

message RecoveryKeyFetchResponse {
  repeated RecoveryKeyFetch messages = 1;
}
