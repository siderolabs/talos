columns:
  - name: IOWeight
    template: '{{ with .IOWeight }}{{ .default | printf "%6s" }}{{ range $disk, $v := . }}{{ if ne $disk "default" }} {{ $disk }}: {{ $v }}{{ end }}{{ end }}{{ else }}{{ "unset" | printf "%6s" }}{{ end }}'
  - name: IOLatency
    template: '{{ range $disk, $v := .IOLatency }}{{ $disk }}: {{ $v.target.UsecToDuration }} {{ end }}'
  - name: IOMax bps r/w iops r/w
    template: '{{ range $disk, $v := .IOMax }}{{ $disk }}: {{ $v.rbps.HumanizeIBytes }}/{{ $v.wbps.HumanizeIBytes }} {{ $v.riops }}/{{ $v.wiops }} {{ end }}'
  - name: Bytes Read/Written
    template: '{{ range $disk, $v := .IOStat }}{{ if $v }}{{ $disk }}: {{ $v.rbytes.HumanizeIBytes }}/{{ $v.wbytes.HumanizeIBytes }} {{ end }}{{ end }}'
  - name: ios Read/Write
    template: '{{ if .Parent }}{{ range $disk, $v := .IOStat }}{{ $disk }}: {{ $v.rios }}/{{ $v.wios }} {{ end }}{{ end }}'
  - name: PressAvg10
    template: '{{ .IOPressure.some.avg10 | printf "%6s" }}'
  - name: PressAvg60
    template: '{{ .IOPressure.some.avg60 | printf "%6s" }}'
  - name: PressTotal
    template: '{{ .IOPressure.some.total.UsecToDuration | printf "%12s" }}'
