apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
    diskSelector:
        match: disk.transport == "nvme"
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
    minSize: 20GiB
    maxSize: 100GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: data
provisioning:
    diskSelector:
        match: "false"
    grow: false
---
apiVersion: v1alpha1
kind: OOMConfig
triggerExpression: "false"
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
    match: link.name == "eth0"
