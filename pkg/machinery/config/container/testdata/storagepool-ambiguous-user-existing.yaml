apiVersion: v1alpha1
kind: StoragePool
name: vm-images
volume:
  name: u-vm-data
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: vm-data
volumeType: directory
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: vm-data
discovery:
  volumeSelector:
    match: volume.partition_label == "MY-DATA"
