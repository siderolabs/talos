apiVersion: v1alpha1
kind: VirtualMachineConfig
name: vm1
cpu:
    count: 4
memory:
    size: 4GiB
disks:
    - name: system
      pool: pool1
      size: 20GiB
      format: qcow2
      bus: virtio
      bootOrder: 1
      provision:
        fromImage:
            library: images
            file: talos-1.14.qcow2
            digest: sha256:5f2bc19e8b4b5b4a8b5e9c0d1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c
            mode: linked
    - name: data
      pool: pool1
      size: 100GiB
      provision:
        blank: {}
    - name: install
      pool: pool1
      type: cdrom
      bootOrder: 2
      provision:
        fromImage:
            library: images
            file: ubuntu-24.04.iso
